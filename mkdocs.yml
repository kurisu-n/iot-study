# The IoT study corpus.
#
# One MkDocs Material site, built by .github/workflows/deploy.yml and served by
# GitHub Pages from the `gh-pages` branch. Source lives on `main`; the built
# site never touches it.
#
# The theme is the FaceCue documentation's, reused deliberately: see
# COOKBOOK.md section 7 for where the palette comes from and why.

site_name: Διαδίκτυο των Πραγμάτων
site_description: >-
  Μελέτη και ασκήσεις για το μάθημα «Διαδίκτυο των Πραγμάτων»,
  Διεθνές Πανεπιστήμιο της Ελλάδος.

# Every canonical tag, the sitemap and the search index base are generated from
# this, and `mkdocs serve` mounts the site under its path, so it has to match
# where the site is actually served, exactly.
#
# The corpus has its own subdomain and sits at the root of it. It was published
# at https://kurisu-n.github.io/iot-study/ until 2026-09-16, which is why the
# earlier form carried a /iot-study/ path: a GitHub Pages project site is served
# from a subpath. GitHub Pages is now switched off, so there is one address.
site_url: https://iot.chris-nasiou.com/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: el

  font: false

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

  # Four schemes, presented as a dropdown rather than Material's cycler. The
  # form Material renders is still what drives the change: the dropdown in
  # docs/javascripts/palette-menu.js clicks these radios, so Material keeps
  # handling the scheme attribute and the localStorage that remembers a choice.
  #
  # ⛔ ORDER IS MEANINGFUL, in two ways. The FIRST entry is the default for a
  # reader who has never chosen, so warm-light leads. And the dropdown lists
  # them in this order, so it reads: the two FaceCue schemes, then the two of
  # this corpus's own, light before dark in each pair.
  #
  # ⚠ Each entry's `toggle.icon` and `toggle.name` describe THAT scheme, not
  # what clicking does next. Material's cycler means the opposite, and these
  # said so until the dropdown replaced it. The menu pairs entry N's icon and
  # name with entry N's radio, so they have to describe themselves.
  palette:
    - scheme: warm-light
      toggle:
        icon: material/white-balance-sunny
        name: FaceCue Ανοιχτό

    - scheme: warm-dark
      toggle:
        icon: material/moon-waning-crescent
        name: FaceCue Σκούρο

    - scheme: academic
      toggle:
        icon: material/weather-sunny
        name: Ακαδημαϊκό

    - scheme: navy
      toggle:
        icon: material/weather-night
        name: Σκούρο Μπλε

extra_css:
  - stylesheets/fc-tokens.css
  - stylesheets/corpus.css

markdown_extensions:
  # Maths. `generic: true` makes it emit the \( \) and \[ \] delimiters MathJax
  # is configured for below, rather than relying on MathJax scanning for $.
  - pymdownx.arithmatex:
      generic: true

  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Σύνδεσμος σε αυτή την ενότητα
      # Sections and subsections only. The step-by-step walkthroughs inside a
      # phase are numbered lists beside figures, not headings, so they never
      # reach the contents column, which is what keeps it from crowding.
      toc_depth: 3

extra_javascript:
  - javascripts/palette-menu.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  # English, and NOT because Greek has no stemmer. lunr-languages ships one, and
  # Material even bundles the file (assets/javascripts/lunr/min/lunr.el.min.js,
  # carrying el.stemmer, el.trimmer and el.stop). Material's search plugin just
  # does not list `el` among the index languages it accepts: set it and the
  # build prints "Option search.lang 'el' is not supported, falling back to
  # 'en'" and carries on. Measured against Material 9.7.7 on 2026-09-16.
  #
  # The practical effect is that Greek text is tokenised and searchable word for
  # word, but not stemmed, so «κόμβος» does not also match «κόμβου». Searching a
  # stem («κόμβ») works. Worth re-testing whenever Material is upgraded.
  - search:
      lang: en

nav:
  - Αρχική: index.md
  - Κεφάλαια:
      - 1. Διάδοση Δεδομένων: chapters/01-data-propagation.md
