# The abbreviations this corpus may use, and what each one stands for.
#
# Read by hooks/shorthand.py on every build. The rule it enforces (Chris,
# 2026-09-16): no shorthand anywhere. An abbreviation may appear on a page only
# after its full name has been written out on that same page, immediately
# followed by the abbreviation in parentheses, e.g. "Directed Diffusion (DD)".
# That first mention becomes the definition, and every later use on the page is
# linked back to it automatically.
#
# Each entry lists the full names the definition may use. The first is used as
# the link's tooltip. Where the course material spells the term out, that
# wording is used; the source is noted beside each entry.
#
# ⛔ An acronym that is NOT listed here fails the build, as does a Greek
# abbreviation like "π.χ." or "διαφ.". Add a term here before using it.

terms:
  ACK:
    - Acknowledgement                            # Lecture 4, slide 7; the receipt a receiver sends back
    - Acknowledgment
  BS:
    - Base Station                               # Lecture 2, slide 2 figure; the course's control centre
  CH:
    - cluster head                               # Lecture 2, slides 41 to 45
    - cluster heads
  CoAP:
    - Constrained Application Protocol           # Lecture 6a (IETF); application-layer protocol for IoT
  CSMA:
    - Carrier Sense Multiple Access              # Lecture 8a, slide 5
  MQTT:
    - Message Queuing Telemetry Transport        # Lecture 6a (OASIS); the name is officially just "MQTT" now
  DT:
    - Direct Transmission                        # Lecture 2, slides 60 and 67
  MTE:
    - Minimum-Energy-Transmission                # Lecture 2, slide 60, which pairs this name with MTE
    - Minimum Transmission Energy
  PEGASIS:
    - Power-Efficient GAthering in Sensor Information Systems   # named on Lecture 2, slide 68; expansion not in the course
  TDMA:
    - Time Division Multiple Access              # not expanded in the course; the scheme's own name
  TEEN:
    - Threshold sensitive Energy Efficient sensor Network       # named on Lecture 2, slide 68; expansion not in the course
  DD:
    - Directed Diffusion                         # Lecture 2, slides 5 to 8
  DAG:
    - Directed Acyclic Graph                     # Lecture 6a, RPL terminology
  DODAG:
    - Destination-Oriented Directed Acyclic Graph   # used in Lecture 6a's message names; expansion not in the course
  DIO:
    - DODAG Information Object                   # Lecture 6a, RPL control messages
  DAO:
    - Destination Advertisement Object           # Lecture 6a
  DIS:
    - DODAG Information Solicitation             # Lecture 6a
  OF:
    - Objective Function                         # Lecture 6a, RPL terminology
  PRR:
    - Packet Reception Ratio                     # Lecture 6a gives only the formula (received / sent); the name is the standard one
  HTTP:
    - Hypertext Transfer Protocol                # Lecture 6a ("CoAP, the HTTP of IoT")
  TCP:
    - Transmission Control Protocol              # Lecture 6a (MQTT on top of TCP/IP)
  UDP:
    - User Datagram Protocol                     # not in the course; named in chapter 12's extra box on CoAP transport
  IP:
    - Internet Protocol                          # Lecture 6a
  RF:
    - Radio Frequency                            # Lecture 9, slide 3
    - Radio frequency
  EBP:
    - Energy Balance Protocol                    # Lecture 3, slide 4
  ETX:
    - Expected Transmission Count                # handwritten notes, pages 15 to 16
  ExOR:
    - Extremely Opportunistic Routing            # Lecture 4, slides 18 to 19; a link-distance routing method
  PFR:
    - Probabilistic Forwarding Protocol          # Lecture 4, slide 30; a multipath routing method
  FND:
    - First Node Dies                            # handwritten notes, page 12; a network-lifetime metric
  HND:
    - Half of Nodes Die                          # handwritten notes, page 12
  LND:
    - Last Node Dies                             # handwritten notes, page 12
  IEEE:
    - Institute of Electrical and Electronics Engineers
  IETF:
    - Internet Engineering Task Force            # Lecture 6a (6LoWPAN, CoAP); Lecture 7b, slide 34
  ITU:
    - International Telecommunication Union      # Lecture 7b, slides 9 and 10 (5G key performance indicators)
  eMBB:
    - enhanced Mobile Broadband                  # Lecture 7a, 5G use cases
  mMTC:
    - massive Machine-Type Communications        # Lecture 7a, 5G use cases ("Massive machine type communications")
  URLLC:
    - Ultra-Reliable Low-Latency Communications  # Lecture 7a, 5G use cases ("Ultra reliable & low latency communications")
  IIoT:
    - Industrial Internet of Things              # Lecture 7b, slide 14; IoT applied to industry
  IPv6:
    - Internet Protocol version 6                # Lecture 6a; not flagged by the hook's patterns, listed so it is still defined and linked
  6LoWPAN:
    - IPv6 over Low power Wireless Personal Area Networks   # Lecture 6a, as the slide spells it
  M2M:
    - Machine-to-Machine                         # Lecture 7b, slides 16 and 20
  MEC:
    - Multi-access Edge Computing                # Lecture 6a, the 5G architecture slide
  OASIS:
    - Organization for the Advancement of Structured Information Standards   # named for MQTT in Lecture 6a; expansion not in the course
  SDO:
    - Standards Development Organization         # Lecture 8b, slides 52 to 56
    - Standards Development Organizations
  IoT:
    - Internet of Things
    - Διαδίκτυο των Πραγμάτων
  LEACH:
    - Low Energy Adaptive Clustering Hierarchy   # Lecture 2, slide 40
  LTP:
    - Local Target Protocol                      # Lecture 4, slide 20; a link-distance routing method
  MOR:
    - Minimum Outage Route                       # Lecture 4, slides 13 to 15 (slide 6 calls it Minimum Outage Rate)
    - Minimum Outage Rate
  LoRaWAN:
    - Long Range Wide Area Network               # Lecture 6a
  LPWAN:
    - Low Power Wide Area Network                # Lecture 6a
    - Low Power Wide Area Networks
  MAC:
    - Medium Access Control                      # Lecture 8a
  MANET:
    - Mobile Ad-Hoc Network                      # 2022 exam, question 2C
    - Mobile Ad-Hoc Networks
  OSI:
    - Open Systems Interconnection               # the classic 7-layer reference model; the 2022 exam borrows the name for its "IoT OSI" 5-layer stack
  TLS:
    - Transport Layer Security                   # the standard transport-layer encryption protocol; named in the IoT security discussion
  ns-2:
    - Network Simulator 2                        # not expanded in the course; the tool's own name
  RPL:
    - Routing Protocol for Low-power and Lossy Networks   # Lecture 6a
  SF:
    - Spreading Factor                           # Lecture 6a; LoRa's tunable range-vs-rate parameter
    - Spread Factor
  WPT:
    - Wireless Power Transfer                    # Lecture 9
  WSN:
    - Wireless Sensor Network                    # 2022 exam and the extra notes
    - Wireless Sensor Networks
    - Ασύρματο Δίκτυο Αισθητήρων
    - Ασύρματα Δίκτυα Αισθητήρων

# Mixed-case words that are names, not abbreviations. The hook flags any word
# with an inner capital (IoT, LoRaWAN) as possible shorthand, so real names that
# look like that are listed here.
proper_names:
  - FaceCue
  - LoRa   # the proprietary radio modulation LoRaWAN is built on (Semtech); a name, not an abbreviation
  - nJ     # nanojoule, an energy unit; looks like shorthand but is not an abbreviation to expand
  - kHz    # kilohertz, a frequency unit
  - mW     # milliwatt, a power unit (chapter 12 exercises)
  - ZigBee # the IEEE 802.15.4-based low-power PAN stack (ZigBee Alliance); a name, not an abbreviation
